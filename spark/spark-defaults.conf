# =============================================================
# Hudi Lab Portable —— Spark 3.3.1 默认配置
# 镜像构建时复制到 /opt/spark/conf/spark-defaults.conf
# =============================================================

spark.master                                   local[*]
spark.app.name                                 hudi-lab-portable
spark.serializer                               org.apache.spark.serializer.KryoSerializer
spark.sql.warehouse.dir                        file:///workspace/warehouse

# ---- Hudi SQL 支持 ----
spark.sql.extensions                           org.apache.spark.sql.hudi.HoodieSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.hudi.catalog.HoodieCatalog
spark.jars                                     /opt/hudi/hudi-spark3.3-bundle_2.12-0.15.0.jar

# ---- 本地开发调优 ----
spark.driver.memory                            2g
spark.sql.shuffle.partitions                   8
spark.ui.enabled                               false
spark.sql.sources.partitionOverwriteMode       dynamic
spark.sql.hudi.enable.multiple.query.optimization  false

# ---- 内嵌 Derby 元数据持久化到命名卷 ----
spark.driver.extraJavaOptions                  -Dderby.system.home=/workspace/metastore
